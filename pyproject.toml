[project]
name = "llm-kt"
version = "0.1.0"
description = "Knowledge tracing for large language models across training checkpoints"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "huggingface_hub>=0.25",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
